<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B1 · S2 无样式页</title>
</head>
<body>

<!--
  这一页是 B1 第一条验收里信息量最低的一端：完全不写 CSS。
  全页只有浏览器默认样式，目的是确认在「几乎没有可提取内容」的页面上，
  扩展仍然给出一份结果，而不是报错、卡住或给一张空白界面。

  服务端和很多内网工具页就是这个样子，所以这不是假想情况。

  期望（大部分来自浏览器默认样式，不需要写样式表也能推出来）：
    · 能正常出结果，不出现任何错误提示
    · 页面底色是白色
    · 字号只有默认的几档（正文 16px、标题 32px 上下、等宽区域 13px 上下）
    · 组件类别基本为空，页面没有按钮形态的元素
    · 链接的默认蓝（#0000ee 系）应当出现在色板里
    · 不应出现「覆盖范围」警示，因为这一页没有任何框架

  反向的验收点在这里：如果结果里冒出这一页根本不存在的颜色或字号，
  说明哪里在凭空造数，那比缺东西严重得多。
-->

<h1>无样式页面</h1>

<p>这是一段默认样式的正文。浏览器给它的字号是 16px，字体是衬线族，
行高接近 1.2。页面没有写任何 CSS，所以接下来看到的一切都是用户代理样式表决定的。</p>

<h2>列表</h2>
<ul>
  <li>第一项，默认的圆点记号</li>
  <li>第二项，注意缩进是浏览器给的</li>
  <li>第三项</li>
</ul>

<h2>表格</h2>
<table>
  <tr><th>名称</th><th>数量</th></tr>
  <tr><td>甲</td><td>1</td></tr>
  <tr><td>乙</td><td>2</td></tr>
</table>

<h2>交互元素</h2>
<p>下面这几个都是默认外观，没有做任何按钮化处理。<a href="#x">这是一个链接</a>，
还有一个 <a href="#y">访问过的链接</a>（颜色与未访问的略有不同）。</p>
<p>
  <button type="button">默认按钮</button>
  <input type="text" value="默认输入框">
  <input type="checkbox"> 默认复选框
</p>

<h2>等宽区域</h2>
<pre>默认的 pre 是等宽字体，字号约 13px。
  它自己也带了缩进和背景的默认表现。</pre>

<hr>

<p>结束。整页到这里为止。</p>

</body>
</html>
